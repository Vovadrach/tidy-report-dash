<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ясно — облік прибирання</title>
    <meta name="description" content="Ясно — легкий облік прибирання: години, заробіток і хто скільки винен." />
    <meta name="author" content="Ясно" />

    <!-- PWA meta tags -->
    <meta name="theme-color" content="#f0f1f4" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Тема до першого кадру — без спалаху світлого фону в темному режимі */
      (function () {
        try {
          var mode = localStorage.getItem("theme") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e0f11");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ясно" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta property="og:title" content="Ясно — облік прибирання" />
    <meta property="og:description" content="Легкий облік прибирання: години, заробіток і хто скільки винен." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
